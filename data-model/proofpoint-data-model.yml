  schemas are not asserted.'
entities:
- name: Threat
  api: proofpoint-tap
  id_field: threatId
  id_shape: opaque string
  source_endpoints:
  - '/v2/threat/summary/<threatId>'
  - '/v2/forensics?threatId=<threatId>'
  relationships:
  - has_many: Forensics
    via: threatId
  - belongs_to: Campaign
    via: campaignId
    note: A threat may be associated with a campaign; Forensics accepts
      includeCampaignForensics=true to fold campaign evidence into a threat response.
- name: Campaign
