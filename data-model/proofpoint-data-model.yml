cross_api_note: 'The three intelligence surfaces do not share identifiers. A TAP threatId
  does not resolve in ET Intelligence, and neither resolves a ZenGuide user. Correlating
  a Proofpoint-detected threat with Proofpoint threat intelligence is a client-side join
  on observables (URL, domain, hash), not a documented key relationship.'
