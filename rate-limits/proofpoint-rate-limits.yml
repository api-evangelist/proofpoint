limit_count: 14
note: 'Proofpoint documents its limits unusually well for an enterprise security vendor
  — per-endpoint numbers, the window, the exhaustion status code and the recovery
  behaviour are all published. What it does NOT publish anywhere is a rate-limit
  RESPONSE HEADER. No X-RateLimit-*, no RateLimit-*, no Retry-After is documented on any
  surface, so a client cannot see how much budget it has left; it can only count its own
  calls and wait for a 429. For an agent that is the difference between planning and
  guessing.'
headers:
  documented: []
  note: No rate-limit signalling headers are documented on any Proofpoint API.
exhaustion:
  status: 429
  message: Too Many Requests
  behavior: 'Rolling window. "The API will start returning 429 HTTP status codes until 24
    hours past the oldest request has elapsed" — recovery is gradual as the oldest
    request ages out, not a fixed reset instant.'
  retry_after_header: false
