note: 'Proofpoint operates NO MCP server for its own APIs. This is the most important
  finding in this file and it is easy to get wrong, because Proofpoint talks about MCP
  constantly — it just talks about it as a thing it SELLS, not a thing it PUBLISHES.
  Three distinct Proofpoint products concern MCP: "Secure MCP Across Your Enterprise" /
  AI MCP Security (discovery, authorization and monitoring of OTHER organisations'' MCP
  servers), Proofpoint Secure Agent Gateway (an MCP-speaking egress control point for a
  customer''s agents, announced for Q1 2026), and Proofpoint Satori MCP Access (which
  lets Satori agents exchange context with Microsoft Copilot and CrowdStrike Charlotte).
  None of those is an MCP endpoint an agent can call to reach the TAP, Reports, ET
  Intelligence, ZenGuide or SER APIs. No MCPServer pointer is wired in apis.yml, in line
  with the rubric''s explicit rule that a vendor page about MCP as a product is not a
  server the vendor runs for its own API.'
