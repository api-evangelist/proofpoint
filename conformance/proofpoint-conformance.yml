- id: rfc5424
  name: RFC 5424 Syslog Protocol
  conforms: true
  evidence: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/SIEM_API
  detail: 'The SIEM API''s syslog rendering is declared conformant to RFC 5424 in the
