- aid: proofpoint-psat-results
  name: Proofpoint Security Awareness Training (ZenGuide) Results API
  image: https://kinlane-productions2.s3.amazonaws.com/api-evangelist-site/company-logos/proofpoint.png
  description: 'The Results API exports Security Awareness Training outcomes for
    business-intelligence and LMS integration: CyberStrength knowledge assessments,
    PhishAlarm reports, ThreatSim simulated-phishing events, training assignments,
    training enrollments and users. Proofpoint publishes a machine-readable apiDoc
    description of it — the only machine-readable contract found anywhere on the
    Proofpoint estate — alongside the rendered reference.'
  humanURL: https://proofpoint.securityeducation.com/api/reporting/documentation/
  baseURL: https://results.us.securityeducation.com/api/reporting/v0.3.0
  tags:
