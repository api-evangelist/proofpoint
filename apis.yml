- aid: proofpoint-secure-email-relay
  name: Proofpoint Secure Email Relay (SER) Email Submission API
  image: https://kinlane-productions2.s3.amazonaws.com/api-evangelist-site/company-logos/proofpoint.png
  description: 'Secure Email Relay lets applications send authenticated transactional
    mail through Proofpoint rather than through an unmanaged relay, which is what
    makes a strict DMARC policy achievable. The Email Submission API accepts a message
    at mail.ser.proofpoint.com after an OAuth client-credential exchange; Proofpoint
    ships first-party client libraries for Python, Java and .NET against it.'
  humanURL: https://api-docs.ser.proofpoint.com/docs/email-submission
  baseURL: https://mail.ser.proofpoint.com
  tags:
  - Email
  - DMARC
  - Transactional Email
  properties:
  - type: APIReference
    url: https://api-docs.ser.proofpoint.com/docs/email-submission
  - type: SDKs
    url: packages/proofpoint-packages.yml
- aid: proofpoint-essentials-siem
  name: Proofpoint Essentials Threat (SIEM) API
  image: https://kinlane-productions2.s3.amazonaws.com/api-evangelist-site/company-logos/proofpoint.png
  description: 'Proofpoint Essentials — the SMB and MSP edition of the platform —
    exposes the same /v2/siem shape as TAP on its own regional hosts, returning blocked
    and permitted clicks and blocked and delivered messages in syslog or JSON for
    SIEM ingestion. HTTP Basic with a service principal and secret, GET only, same
    rolling 24-hour throttle.'
  humanURL: https://help.proofpoint.com/Essentials/Additional_Resources/API_Documentation/Essentials_Threat_API
  baseURL: https://us-siem.proofpointessentials.com/v2
  tags:
  - SIEM
  - Email Security
  - SMB
  properties:
  - type: APIReference
    url: https://help.proofpoint.com/Essentials/Additional_Resources/API_Documentation/Essentials_Threat_API
  - type: Authentication
    url: authentication/proofpoint-authentication.yml
- aid: proofpoint-pod-log
  name: Proofpoint on Demand (PoD) Log API
  image: https://kinlane-productions2.s3.amazonaws.com/api-evangelist-site/company-logos/proofpoint.png
  description: 'The PoD Log API is Proofpoint''s streaming surface rather than a
    request/response one: a client opens a WebSocket to logstream.proofpoint.com and
    subscribes to either the filter (message) log or the MTA (maillog) stream, then
    receives events continuously. It is the only event-shaped Proofpoint API, and it
    is the one whose documentation is not public — help.proofpoint.com redirects the
    PoD Log API article to a customer login.'
  humanURL: https://help.proofpoint.com/Proofpoint_on_Demand/Log_API
  baseURL: https://logstream.proofpoint.com
  tags:
  - Streaming
  - Logging
  - WebSocket
  properties:
  - type: Documentation
    url: https://help.proofpoint.com/Proofpoint_on_Demand/Log_API
