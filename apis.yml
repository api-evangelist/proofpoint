apis:
- aid: proofpoint-tap
  name: Proofpoint Targeted Attack Protection (TAP) API v2
  image: https://kinlane-productions2.s3.amazonaws.com/api-evangelist-site/company-logos/proofpoint.png
  description: 'The TAP v2 API exposes the Threat Insight Dashboard to machines: SIEM
    event download (blocked/permitted clicks, blocked/delivered messages, issues, all),
    campaign identifiers and detail, forensic evidence for a threat or campaign, Very
    Attacked People and top-clicker rosters, threat summaries and URL Defense decoding.
    All endpoints are GET (URL Decoder is POST) over HTTPS with HTTP Basic authentication
    using a service principal and secret minted in the TAP Settings page.'
  humanURL: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation
  baseURL: https://tap-api-v2.proofpoint.com/v2
  tags:
  - Threat Intelligence
