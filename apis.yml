- aid: proofpoint-et-intelligence
  name: Emerging Threats (ET) Intelligence Query API v1
  image: https://kinlane-productions2.s3.amazonaws.com/api-evangelist-site/company-logos/proofpoint.png
  description: 'The ET Intelligence Query API is Proofpoint''s threat-intelligence
    lookup service, reached at api.emergingthreats.net. Thirty-six documented GET
    endpoints pivot across domains, IP addresses, malware samples (by MD5), Suricata/Snort
    signature IDs, CVEs, malware families, threat actors and reputation categories.
    Authentication is a single API key sent in the Authorization header; the default
    rate is 200 queries per minute per key.'
  humanURL: https://apidocs.emergingthreats.net/
  baseURL: https://api.emergingthreats.net/v1
  tags:
  - Threat Intelligence
  - Reputation
  - Malware
  properties:
