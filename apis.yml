aid: proofpoint
name: Proofpoint
description: 'Proofpoint is an enterprise cybersecurity company focused on human-centric
  security — email and collaboration security, data loss prevention, insider threat
  management, digital communications governance, security awareness training and threat
  intelligence. Its public API surface is substantial but gateway-shaped rather than
  developer-portal-shaped: the Targeted Attack Protection (TAP) v2 API, the Threat
  Protection dashboard Reports API, the Emerging Threats (ET) Intelligence Query API,
  the ZenGuide / Security Awareness Training Results API, the Secure Email Relay email
  submission API, the Proofpoint Essentials SIEM API and the Proofpoint on Demand (PoD)
  log stream. Every one of them is documented in public HTML and every one of them is
  credential-gated at runtime; Proofpoint publishes no OpenAPI, AsyncAPI, GraphQL or
  MCP contract for any of them.'
url: https://raw.githubusercontent.com/api-evangelist/proofpoint/refs/heads/main/apis.yml
image: https://kinlane-productions2.s3.amazonaws.com/api-evangelist-site/company-logos/proofpoint.png
x-type: company
x-source: harvest:absent-parent
