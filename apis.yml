- aid: proofpoint-threat-protection-reports
  name: Proofpoint Threat Protection Dashboard Reports API v1
  image: https://kinlane-productions2.s3.amazonaws.com/api-evangelist-site/company-logos/proofpoint.png
  description: 'The Dashboard Reports API returns the same executive-summary,
    effectiveness, people, organization and threat-landscape report cards the Threat
    Protection dashboard renders, plus mail-bomb (email bomb) events. It is the newer
    of the two Proofpoint threat APIs and the only one using OAuth 2.0 client
    credentials: an API key and secret are exchanged at https://auth.proofpoint.com/v1/token
    for a one-hour Bearer token.'
  humanURL: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
  baseURL: https://threatprotection-api.proofpoint.com/api/v1/dash/reports
